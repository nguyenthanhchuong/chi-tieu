<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>Sổ Chi Tiêu</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sổ Chi Tiêu">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<!-- Màn hình nhập PIN: chạy trước, chặn mọi thứ khác -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-icon">🔒</div>
    <h1 class="gate-title">Sổ Chi Tiêu</h1>
    <p class="gate-sub">Nhập mã PIN để mở sổ</p>
    <input type="password" id="pin-input" class="pin-input"
           inputmode="numeric" autocomplete="off" placeholder="••••••">
    <p class="gate-error" id="gate-error" hidden></p>
    <button type="button" class="btn-primary" id="pin-submit">Mở sổ</button>

    <!-- Số hiệu bản giúp biết máy đang chạy bản nào khi cần dò lỗi -->
    <p class="gate-foot">
      <span id="app-version">bản —</span>
      <button type="button" class="link-btn" id="btn-reset">Tải lại bản mới</button>
    </p>
  </div>
</div>

<!-- Ứng dụng chính -->
<div class="app" id="app" hidden>

  <header class="topbar">
    <div class="month-total">
      <span class="month-label" id="month-label">Tháng này</span>
      <span class="month-amount" id="month-amount">—</span>
    </div>
    <button type="button" class="icon-btn" id="btn-refresh" aria-label="Tải lại">↻</button>
  </header>

  <!-- Ô nhập nhanh -->
  <section class="entry">
    <div class="amount-row">
      <input type="text" id="amount" class="amount-input"
             inputmode="numeric" autocomplete="off" placeholder="0">
      <span class="currency">đ</span>
    </div>

    <div class="chips" id="categories"></div>

    <input type="text" id="note" class="note-input"
           autocomplete="off" placeholder="Ghi chú (không bắt buộc)">

    <div class="payer-row">
      <span class="payer-label">Người chi</span>
      <div class="chips payer" id="payers"></div>
    </div>

    <p class="entry-error" id="entry-error" hidden></p>
    <button type="button" class="btn-primary" id="btn-save">Lưu khoản chi</button>
  </section>

  <!-- Tổng theo người -->
  <section class="by-person" id="by-person"></section>

  <!-- Danh sách gần đây -->
  <section class="recent">
    <div class="recent-head">
      <h2>Gần đây</h2>
      <span class="pending" id="pending-badge" hidden></span>
    </div>
    <div id="recent-list" class="recent-list">
      <p class="empty">Đang tải…</p>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="app.js?v=5"></script>
</body>
</html>
